<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Appointment Booking</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: url("{{ url_for('static', filename='doctor.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 5%;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .appointment-box {
      background: rgba(255, 255, 255, 0.95);
      max-width: 500px;
      width: 90%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
      text-align: center;
    }

    h2 {
      color: #6a1b9a;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, select {
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    input[readonly] {
      background-color: #f0f0f0;
    }

    button {
      padding: 12px;
      background-color: #6a1b9a;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #4a0072;
    }
  </style>
</head>
<body>
  <div class="appointment-box">
    <h2>Book Your Appointment</h2>
    <form id="appointmentForm">
      <input type="text" id="doctorName" placeholder="Doctor Name" readonly required />
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Email Address" required />
      <input type="date" required />
      <input type="time" required />
      <select required>
        <option value="">Select Mode</option>
        <option value="Online">Online</option>
        <option value="In-Person">In-Person</option>
      </select>
      <button type="submit">Confirm Appointment</button>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const doctorName = urlParams.get('doctor');
    if (doctorName) {
      document.getElementById('doctorName').value = decodeURIComponent(doctorName);
    }

    document.getElementById('appointmentForm').addEventListener('submit', function (e) {
      e.preventDefault();
      
      const name = document.querySelector('input[placeholder="Your Name"]').value;
      const email = document.querySelector('input[type="email"]').value;
      const date = document.querySelector('input[type="date"]').value;
      const time = document.querySelector('input[type="time"]').value;
      const mode = document.querySelector('select').value;

      const queryParams = new URLSearchParams({
        doctor: doctorName || '',
        name,
        email,
        date,
        time,
        mode
      });

      window.location.href = '/payment?' + queryParams.toString();
    });
  </script>

<h2 id="appointmentDoctor"></h2>

<script>
const params = new URLSearchParams(window.location.search);
const doctor = params.get("doctor");

if (doctor) {
    document.getElementById("doctorName").innerHTML =
        "Appointment with " + doctor;
}
</script>

</body>
</html>
