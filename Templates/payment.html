<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('https://img.freepik.com/free-photo/healthcare-medical-background-flat-lay_23-2148854033.jpg') no-repeat center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .payment-container {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-wrap: wrap;
      width: 90%;
      max-width: 900px;
      overflow: hidden;
    }
    .left, .right {
      padding: 30px;
      flex: 1;
      min-width: 300px;
    }
    .left {
      background: rgba(255, 255, 255, 0.3);
    }
    .right {
      background: rgba(255, 255, 255, 0.4);
    }
    h2 {
      color: #4a0072;
      text-align: center;
      margin-bottom: 20px;
    }
    .details p {
      font-size: 0.95rem;
      color: #333;
      margin-bottom: 12px;
    }
    label {
      font-weight: 600;
      margin: 15px 0 5px;
      display: block;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    .btn {
      background: #6a1b9a;
      color: white;
      padding: 12px;
      border: none;
      width: 100%;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: #4a0072;
    }
    .upi-id {
      background: #fff3fc;
      padding: 10px;
      margin-top: 10px;
      border: 1px dashed #6a1b9a;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      color: #6a1b9a;
    }
    .logos {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    .logos img {
      height: 50px;
      width: auto;
      object-fit: contain;
      border-radius: 8px;
      background: white;
      padding: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .qr {
      text-align: center;
      margin-top: 10px;
    }
    .qr img {
      width: 130px;
      border-radius: 10px;
    }
    .pay-now {
      text-align: center;
      margin-top: 10px;
    }
    .pay-now a {
      background: #00c853;
      padding: 10px 20px;
      display: inline-block;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      text-decoration: none;
    }
    @media (max-width: 768px) {
      .payment-container {
        flex-direction: column;
      }
      .left, .right {
        border: none;
      }
    }
  </style>
</head>
<body>
  <div class="payment-container">
    <div class="left">
      <h2>Appointment Summary</h2>
      <div class="details" id="appointmentDetails"></div>
    </div>

    <div class="right">
      <h2>Make Your Payment</h2>
      <form id="paymentForm">
        <label for="paymentMode">Payment Method</label>
        <select id="paymentMode" required>
          <option value="">Select Payment Option</option>
          <option value="Online">Online</option>
          <option value="Offline">Offline</option>
        </select>

        <div id="transactionSection" style="display:none;">
          <label>Transaction ID</label>
          <input type="text" id="transactionId" placeholder="Enter Transaction ID" />

          <div class="upi-id">UPI ID: <strong>mentalcare@upi</strong></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const doctor = urlParams.get('doctor') || '';
    const name = urlParams.get('name') || '';
    const email = urlParams.get('email') || '';
    const date = urlParams.get('date') || '';
    const time = urlParams.get('time') || '';
    const mode = urlParams.get('mode') || '';

    document.getElementById('appointmentDetails').innerHTML = `
      <p><strong>Doctor:</strong> ${decodeURIComponent(doctor)}</p>
      <p><strong>Name:</strong> ${name}</p>
      <p><strong>Email:</strong> ${email}</p>
      <p><strong>Date:</strong> ${date}</p>
      <p><strong>Time:</strong> ${time}</p>
      <p><strong>Consultation Mode:</strong> ${mode}</p>
    `;

    const paymentMode = document.getElementById('paymentMode');
    const transactionSection = document.getElementById('transactionSection');

    paymentMode.addEventListener('change', () => {
      transactionSection.style.display = paymentMode.value === 'Online' ? 'block' : 'none';
    });

    document.getElementById('paymentForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const mode = paymentMode.value;
      const txId = document.getElementById('transactionId').value.trim();

      if (mode === 'Online' && txId === '') {
        alert('Please enter a transaction ID for online payments.');
        return;
      }

      alert('Payment Successful! Thank you for your appointment.');
      window.location.href = '/contact';
    });
  </script>
